# Render Blueprint: one free web service that runs the API. The public site is the React
# app on Vercel, which forwards /api and /img here (frontend/vercel.json); this service
# also serves its own copy of the app as a fallback. Secrets marked "sync: false" are
# asked for when you create it.
services:
  - type: web
    name: tooth-fairy-dentistry
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/services
    envVars:
      - key: NODE_ENV
        value: production
      # proxies to trust in front of the app (see app.js). Checked live: with 2, the limiters
      # see Render's rotating proxy addresses rather than each visitor, so limits are loose
      # (nobody is locked out by others, and a made-up X-Forwarded-For doesn't help either).
      # Finding the exact value needs a look at the forwarded headers on the live server.
      - key: TRUST_PROXY
        value: "2"
      # the live demo's own database, next to the dev one in the same Atlas cluster
      - key: DATABASE_NAME
        value: toothfairy-demo
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      # password-reset emails (a Mailtrap test inbox)
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
