# Render Blueprint: one free web service that runs the API. The public site is the React
# app on Vercel, which forwards /api and /img here (frontend/vercel.json); this service
# also serves its own copy of the app as a fallback. Secrets marked "sync: false" are
# asked for when you create it.
services:
  - type: web
    name: tooth-fairy-dentistry
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/services
    envVars:
      - key: NODE_ENV
        value: production
      # how many steps back the visitor's IP is (see app.js). Checked on the live server:
      # visitor → Vercel → Cloudflare → Render's proxy → Render's internal proxy → app.
      # Known gap: someone calling this Render address directly (not through the site) can
      # add a made-up X-Forwarded-For to get around the limits. Closing it needs a secret
      # header that only Vercel sends.
      - key: TRUST_PROXY
        value: "4"
      # the live demo's own database, next to the dev one in the same Atlas cluster
      - key: DATABASE_NAME
        value: toothfairy-demo
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      # password-reset emails (a Mailtrap test inbox)
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
